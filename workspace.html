<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Durbar Studio — from problem to production</title>
<meta name="description" content="An intelligent workspace that takes any institution from a raw problem to full-scale production: brainstorm, frame, prioritize, decide, plan, build, and measure — with a reasoning engine that adapts to you." />
<meta name="theme-color" content="#0a0e14" />
<link rel="stylesheet" href="workspace.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2310b981'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='%2303281d' font-family='Helvetica,Arial' font-weight='900'%3ED%3C/text%3E%3C/svg%3E" />
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">D</div><div><b>Durbar</b><small>Studio OS</small></div></div>
    <div class="proj-switch" id="projSwitch"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="user-chip" id="userChip"></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="topTitle">Home</h1><div class="sub" id="topSub"></div></div>
      <div class="stepper" id="stepper"></div>
      <div class="spacer"></div>
      <button class="kbtn" id="cmdkBtn">🔎 Search & commands <kbd>⌘K</kbd></button>
      <button class="btn sm ghost" id="themeBtn" title="Toggle theme">🌙</button>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="cmdk" id="cmdk"><div class="cmdk-box"><input id="cmdkInput" placeholder="Search views, run actions… (try ‘frame’, ‘new idea’, ‘theme’)" /><div class="results" id="cmdkResults"></div></div></div>
<div class="modal" id="modal"><div class="sheet" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script src="intel.js"></script>
<script src="workspace.js"></script>
</body>
</html>
